
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN Traders | Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">SN Traders</h1>

        <div class="nav-actions">
            <button id="cart-btn">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>

    <header class="hero">
        <h2>Discover Your Favourite Products</h2>
        <p>Everything you love, all in one place.</p>
    </header>

    <main class="container">

        <section class="controls">
            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
            >

            <div id="category-buttons" class="category-buttons">
                <button class="active" data-category="all">All</button>
            </div>
        </section>

        <p id="loading-message">Loading products...</p>
        <p id="error-message"></p>

        <section id="product-container" class="product-grid">
        </section>

    </main>

    <div id="cart-overlay" class="cart-overlay"></div>

    <aside id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <button id="close-cart">✕</button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-footer">
           <h3>Total: ₹<span id="cart-total">0.00</span></h3>
            <button id="checkout-btn">Proceed to Checkout</button>
        </div>
    </aside>

    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">✕</button>
            <h2>Checkout</h2>
            <p>Confirm your order to complete your purchase.</p>
            <button id="confirm-order">Confirm Order</button>
        </div>
    </div>

<footer>
    <p>© 2026 SN Traders | Datheon Internship Project</p>
    <p>Developed by Fathima Lubaba Bathool MB</p>
</footer>

    <script src="script.js"></script>
</body>
</html>
